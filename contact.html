<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt — Studio Glazebrook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="nav"></nav>
  <div class="nav-mobile-menu" id="mobile-menu"></div>

  <div class="text-page">
    <h1>Kontakt</h1>
    <p>
      Studio Glazebrook<br>
      Oslo<br>
      <a href="mailto:din@epost.no">edvard@grape.no</a>
    </p>

    <form class="contact-form" id="contact-form">
      <div class="form-field">
        <label>Navn</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-field">
        <label>E-post</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-field">
        <label>Melding</label>
        <textarea name="message" required></textarea>
      </div>
      <button type="submit" class="btn-inquiry">Send</button>
    </form>
  </div>

  <script src="nav.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      e.target.innerHTML = '<p style="padding:20px 0; letter-spacing:0.1em">Takk for meldingen, vi tar kontakt snart.</p>';
    });
  </script>

</body>
</html>
