  <div id="slideshow">
    <!-- Placeholder-slides med nøytrale farger til du har bilder. -->
    <!-- Når du har bilder: bytt style="background-color:..." med style="background-image: url('images/forsidebilder/1.jpg')" -->
    <div class="slide active" style="background-color: #d2cdc6;"></div>
    <div class="slide"        style="background-color: #c4bfb8;"></div>
    <div class="slide"        style="background-color: #dbd7d1;"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    let i = 0;
    setInterval(() => {
      slides[i].classList.remove('active');
      i = (i + 1) % slides.length;
      slides[i].classList.add('active');
    }, 5000); // bytter slide hvert 5. sekund
  </script>
