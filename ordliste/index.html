<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f6; color: #17171a; }

  .count { color: #6b6b73; font-size: 12px; }
  .row { background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .row.blocked { opacity: 0.45; }
  .head { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
  .word { font-weight: 800; font-size: 16px; }
  .wc { color: #6b6b73; font-style: italic; font-size: 12px; }
  .def { margin-top: 2px; }
  .blockbox { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b6b73; white-space: nowrap; }
  .bluffs { margin-top: 8px; border-top: 1px solid #ececf0; padding-top: 8px; display: none; }
  .row.open .bluffs { display: block; }
  .bluff { font-size: 13.5px; padding: 3px 0; }
  .bluff .by { color: #6b6b73; font-size: 11px; }
  .bluff.unapproved { opacity: 0.55; }
  .none { color: #9a9aa2; font-size: 12.5px; font-style: italic; }
  #gate { position: fixed; inset: 0; background: #f4f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  #gate input { border: 1.5px solid #c9c9cf; border-radius: 999px; padding: 10px 18px; font-size: 16px; text-align: center; }
  #gate .err { color: #b04a3f; font-size: 13px; min-height: 18px; }
  .loading { color: #9a9aa2; font-size: 12.5px; }
</style>

</div>

  } else {
    await fetch(SUPA + '/rest/v1/blocked_words?lang=eq.' + lg + '&word=eq.' + encodeURIComponent(w), { method: 'DELETE', headers: H });
    blockedCache[lg].delete(w);
  }
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = WORDS[lang].filter((r) => !q || r.w.toLowerCase().includes(q) || r.d.toLowerCase().includes(q));
  document.getElementById('count').textContent = rows.length + ' av ' + WORDS[lang].length + ' ord';
  const bl = blockedCache[lang] || new Set();
  const by = bluffCache[lang] || {};
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const r of rows) {
    const wl = r.w.toLowerCase();
    const bluffs = by[wl] || [];
    const div = document.createElement('div');
    div.className = 'row' + (bl.has(wl) ? ' blocked' : '');
    div.innerHTML =
      '<div class="head">' +
      '<span class="word">' + esc(cap(r.w)) + '</span>' +
      '<span class="wc">' + esc(r.c) + (bluffs.length ? ' · ' + bluffs.length + ' bløff' + (bluffs.length === 1 ? '' : 'er') : '') + '</span>' +
      '<label class="blockbox" onclick="event.stopPropagation()"><input type="checkbox" ' + (bl.has(wl) ? 'checked' : '') + '> blokkér</label>' +
      '</div>' +
      '<div class="def">' + esc(r.d) + '</div>' +
      '<div class="bluffs">' +
      (bluffs.length
        ? bluffs
            .map(
              (b) =>
                '<div class="bluff' + (b.approved ? '' : ' unapproved') + '">' +
                esc(cap(b.text)) +
                ' <span class="by">– ' + esc(b.author || '?') + (b.approved ? '' : ' · ikke godkjent') + '</span></div>'
            )
            .join('')
        : '<div class="none">Ingen lagrede bløffer på dette ordet ennå</div>') +
      '</div>';
    div.querySelector('.head').addEventListener('click', () => div.classList.toggle('open'));
    const cb = div.querySelector('input[type=checkbox]');
    cb.addEventListener('change', async () => {
      cb.disabled = true;
      try {
        await setBlocked(lang, r.w, cb.checked);
        div.classList.toggle('blocked', cb.checked);
      } catch {
        cb.checked = !cb.checked;
      }
      cb.disabled = false;
    });
    list.appendChild(div);
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

async function boot() {
  const tabs = document.getElementById('tabs');
  for (const [lg, label] of LANGS) {
    const b = document.createElement('button');
    b.className = 'tab' + (lg === lang ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', async () => {
      lang = lg;
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('on'));
      b.classList.add('on');
      await fetchLang(lg);
      render();
    });
    tabs.appendChild(b);
  }
  document.getElementById('q').addEventListener('input', render);
  await fetchLang(lang);
  render();
}
</script>
</body>
</html>
