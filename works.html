<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kolleksjon — Studio Glazebrook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="nav"></nav>
  <div class="nav-mobile-menu" id="mobile-menu"></div>

  <div class="page-content">
    <div class="page-title">Kolleksjon</div>
    <div class="works-grid" id="works-grid"></div>
  </div>

  <script src="nav.js"></script>
  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('works-grid');
    products.forEach(function(p) {
      const cover = p.coverImage
        ? 'images/' + p.id + '/' + p.coverImage
        : 'images/' + p.id + '/0.jpg';

      const dotClass = 'dot-' + (p.status || 'empty');

      const card = document.createElement('div');
      card.className = 'work-card';
      card.onclick = function() { window.location.href = 'product.html?id=' + p.id; };
      card.innerHTML =
        '<div class="work-card-image">' +
          '<img src="' + cover + '" alt="' + p.name + '" onerror="this.parentElement.style.background=\'#e8e4e0\'">' +
        '</div>' +
        '<div class="work-card-info">' +
          '<div class="work-card-name"><span class="' + dotClass + '"></span>' + p.number + ' ' + p.name + '</div>' +
          '<div class="work-card-year">' + p.year + '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  </script>

</body>
</html>
